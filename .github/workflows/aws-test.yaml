name: Sync Codebase to Bedrock S3

on:
  push:
    branches:
      - main  # Triggers the crawl and sync automatically whenever code hits main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate RAG Markdown and Metadata
        run: python .github/scripts/generate_rag_docs.py

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::400485161087:role/GitHubActionsWorkflowRole
          aws-region: us-east-1
          audience: ://amazonaws.com

      - name: Sync Markdown Output to Amazon S3
        run: aws s3 sync ./rag_output s3://knowledgebasetestforai/codebase/ --delete

      - name: Trigger Amazon Bedrock Knowledge Base Sync
        run: |
          aws bedrock-agent start-ingestion-job \
            --knowledge-base-id JLKZWJRBUQ \
            --data-source-id AD8Q4H8R2Q \
            --region us-east-1